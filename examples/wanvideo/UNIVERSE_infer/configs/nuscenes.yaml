# Environment variables override these defaults. `aliases` keep compatibility
# with the previous training/eval launcher environment names.

NUSCENES_DATAROOT:
  default:
  aliases:
    - NUSCENES_EVAL_DATAROOT
NUSCENES_VERSION:
  default: v1.0-trainval
  aliases:
    - NUSCENES_EVAL_VERSION
NUSCENES_SPLIT:
  default: val
  aliases:
    - NUSCENES_EVAL_SPLIT
CAMERA_NAME:
  default: CAM_FRONT
  aliases:
    - NUSCENES_EVAL_CAMERA_NAME
POLICY_ANNO_JSON:
  default: "${REPO_ROOT}/data/plan_val_filter_w_ego_w_cmd_1s_to_19s.json"
  aliases:
    - NUSCENES_EVAL_POLICY_ANNO_JSON

FULL_CKPT: "${REPO_ROOT}/checkpoints/UNIVERSE.safetensors"
LOCAL_MODEL_PATH: "${REPO_ROOT}/models"
OUTPUT_DIR: "${REPO_ROOT}/outputs/universe/nuscenes"

NUM_INFERENCE_STEPS:
  default: 3
  aliases:
    - NUSCENES_EVAL_NUM_INFERENCE_STEPS
CFG_SCALE:
  default: 1.0
  aliases:
    - NUSCENES_EVAL_CFG_SCALE
SEED:
  default: 0
  aliases:
    - NUSCENES_EVAL_SEED
NUM_HISTORY_FRAMES:
  default: 5
  aliases:
    - NUSCENES_EVAL_NUM_HISTORY_FRAMES
NUM_FUTURE_FRAMES:
  default: 8
  aliases:
    - NUSCENES_EVAL_NUM_FUTURE_FRAMES
MODEL_FUTURE_FRAMES:
  default: 8
  aliases:
    - NUSCENES_EVAL_MODEL_FUTURE_FRAMES
SCENE_FUTURE_EXTRA_SECONDS:
  default: 0.0
  aliases:
    - NUSCENES_EVAL_SCENE_FUTURE_EXTRA_SECONDS
TARGET_FPS:
  default: 2
  aliases:
    - NUSCENES_EVAL_TARGET_FPS
TRAJECTORY_CONDITION_MODE:
  default: velocity
  aliases:
    - NUSCENES_EVAL_TRAJECTORY_CONDITION_MODE
METRIC_HORIZONS_S:
  default: "1,2,3"
  aliases:
    - NUSCENES_EVAL_METRIC_HORIZONS_S
EGO_BOX_LENGTH_M:
  default: 4.084
  aliases:
    - NUSCENES_EVAL_EGO_BOX_LENGTH_M
EGO_BOX_WIDTH_M:
  default: 1.85
  aliases:
    - NUSCENES_EVAL_EGO_BOX_WIDTH_M
HEIGHT: 480
WIDTH: 832
USE_FOCAL_UNIFICATION: 0
FOCAL_TARGET_PX: auto

MAX_SCENES:
  default:
  aliases:
    - NUSCENES_EVAL_MAX_SCENES
MAX_EVAL_TOKENS:
  default:
  aliases:
    - NUSCENES_EVAL_MAX_EVAL_TOKENS
SAVE_VIZ:
  default: 0
  aliases:
    - NUSCENES_EVAL_SAVE_VIZ
VIZ_MAX_TOKENS:
  default: 20
  aliases:
    - NUSCENES_EVAL_VIZ_MAX_TOKENS
VIZ_DIR:
  default:
  aliases:
    - NUSCENES_EVAL_VIZ_DIR
DEBUG_PROMPT_STEPS:
  default: 0
  aliases:
    - NUSCENES_EVAL_DEBUG_PROMPT_STEPS
SHOW_DENOISE_PROGRESS: 0
SHOW_VAE_PROGRESS: 0
